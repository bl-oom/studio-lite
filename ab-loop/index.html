<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB Loop – bl-oom Studio Lite</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
<meta name="theme-color" content="#0e0f12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Overpass+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
/*
VOICE: 編集室の道具。静かで確実、操作に迷わない。
IDEA: 編集ソフトのタイムライン（IN/OUT点とループ範囲）。
PICTURE: 残りの高さいっぱいの映像プレビュー、その下にA-B範囲が光るタイムライン。
COLOUR/TYPE: 黒に近いモニター面、A=シアン、B=マゼンタ。Zen Kaku Gothic + 等幅数字。
LAYOUT: 常に1画面に収める。縦長画面は上プレビュー・下操作、幅広画面(Fold内画面)は左プレビュー・右操作。ボタン位置は固定。
*/






h1{order:-1;font-size:16px;margin:0 2px;font-weight:700;flex:none}
.stage{order:0;position:relative;flex:1 1 auto;min-height:120px;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage canvas{display:none}
.stage.looping canvas{display:block}.stage.looping video{visibility:hidden}


.badge{position:absolute;left:8px;top:8px;font:600 12px "Overpass Mono",monospace;background:rgba(0,0,0,.65);padding:3px 9px;border-radius:99px;display:none}
.stage.looping .badge{display:none}
.badge,.fsbtn{display:none!important}
.stage.fs{position:fixed;inset:0;z-index:50;border-radius:0;border:0;background:#000;min-height:0}
.stage.fs .resume,.stage.fs .sheet{display:none}
.badge{pointer-events:none}

.stage:fullscreen .resume,.stage:fullscreen .sheet,.stage:fullscreen .badge{display:none!important}
.fsbtn{position:absolute;right:8px;top:8px;z-index:2;width:auto;height:32px;padding:0 10px;font-size:12px;background:rgba(0,0,0,.6);border:1px solid #fff3;display:none}
.stage.has .fsbtn{display:flex}.stage:fullscreen .fsbtn{display:none}
.side>*{order:1;flex:none}.side>h1{order:-1}
.tlrow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:8px;align-items:center}
.tl{position:relative;height:44px;touch-action:none;cursor:ew-resize;margin:0 10px 0 14px}
.playb{height:46px;font-size:18px}





.grad{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:0;text-shadow:0 1px 2px #0005;font-size:16px}
#esheet{border-color:transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(90deg,var(--a),var(--b)) border-box;border:1.5px solid transparent}
#esheet .selb{border-color:#3a3f4b}
.erow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;align-items:center;color:var(--mute);font-size:13px}

.range{position:absolute;top:16px;height:12px;background:linear-gradient(90deg,var(--a),var(--b));opacity:.55;border-radius:6px;display:none}
.mk{position:absolute;top:14px;width:3px;height:28px;margin-left:-1.5px;display:none}
.mk.ghost{opacity:.5}
.mk.drag span{transform:translateX(-50%) scale(1.25)}
.mk span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font:700 12px "Overpass Mono",monospace;color:#000;border-radius:5px;padding:1px 7px;transition:transform .1s}
#mA{background:var(--a)}#mA span{background:var(--a)}#mB{background:var(--b)}#mB span{background:var(--b)}


.times div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 8px;white-space:nowrap;display:flex;gap:6px;align-items:baseline;height:34px}

#tA{color:var(--a)}#tB{color:var(--b)}

button,select,.dl{font:700 14px "Zen Kaku Gothic New",sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;height:46px;padding:4px 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;width:100%}
label.btn{font:700 14px "Zen Kaku Gothic New",sans-serif;background:var(--panel);border:1px solid var(--line);border-radius:12px;height:46px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
button:active{transform:scale(.97)}
/* ボタンは影なしのフラット */
button,label.btn,.dl{box-shadow:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}

select{appearance:none;text-align-last:center;font-size:14px}
.setA{border-color:var(--a);color:var(--a)}.setB{border-color:var(--b);color:var(--b)}

.go{grid-column:span 4;height:52px;font-size:18px;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:0;text-shadow:0 1px 2px #0005}
.go:disabled{opacity:.4}
.go{gap:8px;letter-spacing:.04em}

.go.on{background:linear-gradient(#17191e,#17191e) padding-box,linear-gradient(90deg,var(--a),var(--b)) border-box;border:2px solid transparent;color:#fff;text-shadow:none}

button.orig{border-color:#7ee0a0;color:#7ee0a0}
button.orig.on{background:#7ee0a0;color:#06210f}
label.bgm{border-color:#f5b83d;color:#f5b83d;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 8px;display:block;line-height:44px}
label.bgm.has{background:#f5b83d;color:#1a1300}






select.nat{display:none}

.selb{padding-right:16px!important;white-space:nowrap;font-size:12.5px!important;letter-spacing:-.02em}
.selb{position:relative}
.selb::after{content:"";position:absolute;right:8px;top:50%;width:6px;height:6px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-70%) rotate(45deg)}
.sheet.pick{z-index:7}


.elab{color:var(--mute);font-size:12px;margin:2px 2px -2px}
.opt.sel,.qlist button.sel{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:0;text-shadow:0 1px 2px #0005}









.estart{height:52px;flex:none}
.picklist button.sel{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:0;text-shadow:0 1px 2px #0005}

.sheet[hidden]{display:none}
.shd{display:flex;justify-content:space-between;align-items:center}
.shd span{font:600 14px "Overpass Mono",monospace;color:var(--ink)}
.rg2{background:#f5b83d}
#bmA,#bmB{background:#f5b83d}#bmA span,#bmB span{background:#f5b83d}

.resume{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;width:auto;height:52px;background:#9b8cff;color:#14102e;border:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px;display:block}
.resume[hidden]{display:none}
.pbtn{border-color:#9b8cff;color:#c9c0ff}

.prow{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:6px}
.prow input{font:16px "Zen Kaku Gothic New",sans-serif;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;height:46px;padding:0 12px}
.pinfo{margin:0;color:var(--mute);font-size:12px}
.plist{display:flex;flex-direction:column;gap:6px}
.pi{display:grid;grid-template-columns:64px minmax(0,1fr) 64px 52px;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
.pi.cur{border-color:#9b8cff}
.pi img,.pi .ph{width:64px;height:40px;object-fit:cover;border-radius:6px;background:#000}
.pi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi small{color:var(--mute);font-size:12px}
.pi button{height:40px;font-size:13px}
.pi .del{color:#ff8a8a}
/* 横長の画面（タブレット横向きなど）：左プレビュー、右操作 */
@media (min-width:700px) and (min-aspect-ratio:5/4){
  .wrap{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);gap:12px;padding:12px max(var(--edge),env(safe-area-inset-right)) max(var(--edgeB),env(safe-area-inset-bottom)) max(var(--edge),env(safe-area-inset-left))}
  .stage{height:100%}
  .side{display:flex;flex-direction:column;gap:10px;overflow:auto;position:relative}
  h1{font-size:20px}
  button,select,.dl,label.btn{height:54px;font-size:15px}
  .go{height:60px}
  label.bgm{line-height:52px}
}
/* 横向きスマホなど高さが低いとき */
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr);gap:8px;max-width:none}
  .stage{height:100%}
  .side{display:flex;flex-direction:column;gap:6px;overflow:auto;position:relative}
  h1{display:none}
}
@media (max-height:700px) and (max-aspect-ratio:1/1){h1{display:none}}
/* Fold内画面など幅が広い縦〜正方形：操作ボタンを大きく */
@media (min-width:700px) and (max-aspect-ratio:5/4){
  .wrap{max-width:860px;gap:10px;padding:12px max(var(--edge),env(safe-area-inset-right)) max(var(--edgeB),env(safe-area-inset-bottom)) max(var(--edge),env(safe-area-inset-left))}
  button,select,.dl,label.btn{height:52px;font-size:15px}
  .go{height:58px}
  label.bgm{line-height:50px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="stage" id="stage">
  <video id="v" playsinline preload="auto"></video>
  <canvas id="cv"></canvas>
  <div class="badge" id="badge">▶ A→B</div>
  <button class="resume" id="resume" hidden></button>
  <button class="fsbtn" id="fs">⛶ 全画面</button>
  <label class="empty" id="empty" for="file"><div><b>動画を選ぶ</b>端末に保存されている動画をタップして開く</div></label>
</div>
<div class="side">
  <div class="sheet pick" id="pick" hidden>
    <div class="shd"><b id="pickT">選択</b><button id="pickX" class="okb mini">閉じる</button></div>
    <div class="picklist" id="pickL"></div>
  </div>
  <div class="sheet" id="esheet" hidden>
    <div class="shd"><b>レンダリング</b><button id="eclose" class="okb mini">閉じる</button></div>
    <select id="rep" class="nat" aria-label="回数"><option value="audio" selected>音声合わせ</option><option value="1">1回</option><option value="2">2回</option><option value="3">3回</option><option value="4">4回</option><option value="5">5回</option><option value="6">6回</option><option value="7">7回</option><option value="8">8回</option><option value="9">9回</option><option value="10">10回</option><option value="11">11回</option><option value="12">12回</option><option value="13">13回</option><option value="14">14回</option><option value="15">15回</option><option value="16">16回</option><option value="17">17回</option><option value="18">18回</option><option value="19">19回</option><option value="20">20回</option><option value="21">21回</option><option value="22">22回</option><option value="23">23回</option><option value="24">24回</option><option value="25">25回</option><option value="26">26回</option><option value="27">27回</option><option value="28">28回</option><option value="29">29回</option><option value="30">30回</option></select>
    <select id="q" class="nat" aria-label="画質"><option value="src" selected>素材と同じ</option><option value="720">標準（720p）</option><option value="1080">高め（1080p）</option></select>
    <small class="elab">回数</small>
    <button type="button" id="repAudio" class="opt">音声合わせ</button>
    <div class="repwrap" id="repwrap"><div class="repmark"></div><div class="repsl" id="repsl"></div></div>
    <small class="elab">画質</small>
    <div class="qlist" id="qlist"></div>
    <button id="estart" class="grad estart">レンダリング開始</button>
  </div>
  <div class="sheet" id="psheet" hidden>
    <div class="shd"><b>プロジェクト</b><button id="pclose" class="okb mini">閉じる</button></div>
    <div class="prow"><input id="pname" type="text" placeholder="プロジェクト名" maxlength="40"><button id="psave" class="okb">保存</button></div>
    <p class="pinfo" id="pinfo">動画・裏の音・A/B点・速度などをまとめてこの端末に保存します。</p>
    <div class="plist" id="plist"></div>
  </div>
  <div class="sheet" id="sheet" hidden>
    <div class="shd"><b>音のA・B</b><span id="bnow">0:00:00</span></div>
    <div class="tl" id="btl"><div class="track"></div><div class="range rg2" id="brange"></div>
      <div class="mk" id="bmA"><span>A</span></div><div class="mk" id="bmB"><span>B</span></div><div class="head" id="bhead" style="left:0"></div></div>
    <div class="times"><div><small>A</small><span id="btA">頭</span></div><div><small>B</small><span id="btB">最後</span></div><div><small>長さ</small><span id="bdur">--</span></div></div>
    <div class="grid">
      <button id="bback">◀ 1秒</button><button id="bplay">試聴</button><button id="bfwd">1秒 ▶</button><button id="bok" class="okb">閉じる</button>
      <button class="setA" id="bsetA">ここを音A</button><button class="setB" id="bsetB">ここを音B</button><button id="breset">リセット</button><button id="bclr">音を外す</button>
    </div>
  </div>
<div class="tlrow">
<div class="tl" id="tl">
  <div class="track"></div>
  <div class="range" id="range"></div>
  <div class="mk" id="mA"><span>A</span></div>
  <div class="mk" id="mB"><span>B</span></div>
  <div class="head" id="head" style="left:0"></div>
</div>
<button class="mode" id="mode" data-m="pp" aria-label="バウンド" title="バウンド"><span class="mi">⇄</span><span class="mt">バウンド</span></button>
</div>
<div class="times">
  <div><small>今</small><span id="tN">0:00.00</span></div>
  <div><small>A</small><span id="tA">--</span></div>
  <div><small>B</small><span id="tB">--</span></div>
</div>
<div class="grid">
  <button class="setA wide2" id="setA">ここをA点に</button>
  <button class="setB wide2" id="setB">ここをB点に</button>
  <button id="back">◀ 1コマ</button>
  <button id="fwd">1コマ ▶</button>
  <select id="spd" aria-label="速度">
    <option value="0.25">0.25倍</option><option value="0.5">0.5倍</option><option value="1" selected>1倍（標準）</option><option value="1.5">1.5倍</option><option value="2">2倍</option><option value="3">3倍</option>
  </select>
  <label class="btn" for="file">動画変更</label>
  <button class="go" id="go" disabled><svg class="gi" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4.2v11.6c0 .6.7 1 1.2.7l9-5.8c.5-.3.5-1 0-1.3l-9-5.8C6.7 3.2 6 3.6 6 4.2z" fill="currentColor"/></svg><span>ループ開始</span></button>
  <button class="orig on" id="orig" aria-pressed="true">♪ 元の音</button>
  <label class="btn bgm" for="bfile" id="bname">♪ 裏の音</label>
  <button id="bopen" disabled>音の範囲</button>
  <button id="exp" class="exp" disabled>レンダリング</button>
  <div class="volbox"><label class="vol"><span>音量</span><input type="range" id="bvol" min="0" max="1" step="0.05" value="1" aria-label="音量"></label><small>ここで設定した音量でレンダリングされます</small></div>
  <button id="popen" class="pbtn" hidden>プロジェクト</button>
</div>
<div class="bar">
  <p class="note" id="note">A点とB点を決めて「ループ開始」。音は「元の音」（範囲をA→Bで繰り返し）か「裏の音」。A・B未指定なら動画全体。右のボタンで「バウンド」（逆再生で戻る）と「ループ」（Aに戻る）を切り替え。元の音は流れません。</p>
  <a id="dl" class="dl">↓ もう一度保存</a>
</div>
</div>
<input type="file" id="file" accept="video/*">
<input type="file" id="bfile" accept="audio/*,video/*">
<audio id="bgm" loop preload="auto"></audio>
</div>

<script src="../mp4-muxer.js"></script>
<script src="../common.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const v=$('v'),cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),note=$('note');
let A=null,B=null,url=null,fps=30;
let cacheQ=null,rec=null,chunks=[],recOn=false,expPending=false,cycles=0,recMime='';
const bgm=$('bgm');let bUrl=null,actx=null,gain=null,adest=null;
// 音の出どころ：元の音（動画のループ範囲をA→Bで繰り返す）／裏の音／なし
let useOrig=true;
const hasAud=()=>useOrig?!!url:!!bUrl;
const effA=()=>useOrig?span()[0]:(bA||0);
const effB=()=>useOrig?span()[1]:bB;
function syncSrc(){const want=useOrig?url:bUrl;if(want){if(bgm.src!==want){bgm.src=want}}else if(bgm.getAttribute('src')){bgm.pause();bgm.removeAttribute('src');bgm.load()}
  const o=$('orig');o.classList.toggle('on',useOrig);o.setAttribute('aria-pressed',useOrig);
  $('bname').classList.toggle('has',!useOrig&&!!bUrl);$('bopen').disabled=useOrig||!bUrl;if(useOrig)$('sheet').hidden=true}
function setOrig(on){const was=!bgm.paused;useOrig=on;bgm.pause();syncSrc();if(was||(looping&&phase))bgmPlay(true)}
function audioInit(){
  if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaElementSource(bgm);gain=actx.createGain();adest=actx.createMediaStreamDestination();
    src.connect(gain);gain.connect(actx.destination);gain.connect(adest);gain.gain.value=+$('bvol').value;
  }catch(e){actx=null}
}
function bgmPlay(fromStart){if(!hasAud())return;syncSrc();audioInit();if(actx&&actx.state==='suspended')actx.resume();if(fromStart)bgm.currentTime=effA();bgm.play().catch(()=>{})}
let bA=null,bB=null,bPrev=false;bgm.loop=false;
const bEnd=()=>bB!=null?bB:(bgm.duration||0);
// 音のループ：A→Bまで流れたら瞬時にAへ戻る
let recOnce=false,audioDone=false;
function bWrap(){const a=effA(),b=effB();if(b!=null&&bgm.currentTime>=b){if(recOnce){bgm.pause();audioDone=true}else bgm.currentTime=a}}
bgm.onended=()=>{if(recOnce){audioDone=true;return}if(bPrev||looping){bgm.currentTime=effA();bgm.play().catch(()=>{})}};
bgm.ontimeupdate=()=>{bWrap();bui()};
(function bw(){if(!bgm.paused)bWrap();if(!$('sheet').hidden)bui();requestAnimationFrame(bw)})();
const bpct=x=>((bgm.duration?x/bgm.duration:0)*100)+'%';
function bui(){
  const d=bgm.duration||0;$('bdur').textContent=d?fmt(d):'--';$('bnow').textContent=fmt(bgm.currentTime);
  $('bhead').style.left=bpct(bgm.currentTime);
  $('btA').textContent=bA!=null?fmt(bA):'頭';$('btB').textContent=bB!=null?fmt(bB):'最後';
  $('bmA').style.display=bA!=null?'block':'none';$('bmA').style.left=bpct(bA||0);
  $('bmB').style.display=bB!=null?'block':'none';$('bmB').style.left=bpct(bB||0);
  const a=bA||0,b=bEnd();const rg=$('brange');
  if(d&&(bA!=null||bB!=null)){rg.style.display='block';rg.style.left=bpct(a);rg.style.width=((b-a)/d*100)+'%'}else rg.style.display='none';
  $('bplay').textContent=(!bgm.paused&&bPrev)?'停止':'試聴';
}
bgm.onloadedmetadata=bui;
function bseek(x){const d=bgm.duration||0;bgm.currentTime=Math.max(0,Math.min(d,x));bui()}
$('bopen').onclick=()=>{$('psheet').hidden=true;$('esheet').hidden=true;$('sheet').hidden=false;bui()};
$('bok').onclick=()=>{if(bPrev&&!looping){bgm.pause()}bPrev=false;$('sheet').hidden=true;bui()};
$('bplay').onclick=()=>{audioInit();if(actx&&actx.state==='suspended')actx.resume();
  if(!bgm.paused&&bPrev){bgm.pause();bPrev=false}else{bPrev=true;if(bB!=null&&bgm.currentTime>=bB||bgm.currentTime<(bA||0))bgm.currentTime=bA||0;bgm.play().catch(()=>{})}bui()};
$('bback').onclick=()=>bseek(bgm.currentTime-1);
$('bfwd').onclick=()=>bseek(bgm.currentTime+1);
$('bsetA').onclick=()=>{bA=bgm.currentTime;if(bB!=null&&bB<=bA)bB=null;bui()};
$('bsetB').onclick=()=>{const x=bgm.currentTime;if(x>(bA||0)+0.05){bB=x;bgm.currentTime=bA||0}bui()};
$('breset').onclick=()=>{bA=null;bB=null;bui()};
{const t2=$('btl');const sk=e=>{const r=t2.getBoundingClientRect();bseek((e.clientX-r.left)/r.width*(bgm.duration||0))};
 t2.onpointerdown=e=>{t2.setPointerCapture(e.pointerId);sk(e);t2.onpointermove=sk};t2.onpointerup=()=>{t2.onpointermove=null}}
function bgmStop(){if(!bPrev)bgm.pause()}
let aFile=null;

function tick(now){

  const sp=+$('spd').value,a=times[0],b=times[times.length-1];

      if(recOn&&(++cycles,recOnce?audioDone:cycles>=repN())){t=b;ctx.drawImage(frames[frames.length-1],0,0);recOn=false;recOnce=false;setTimeout(()=>{rec.stop();bgmPlay(true)},120);setRecUI(false);note.textContent='レンダリング処理中…';ui();raf=requestAnimationFrame(tick);return}

  if(t<=a){if(recOn&&(++cycles,recOnce?audioDone:cycles>=repN())){t=a;ctx.drawImage(frames[0],0,0);recOn=false;recOnce=false;setTimeout(()=>{rec.stop();bgmPlay(true)},120);setRecUI(false);note.textContent='レンダリング処理中…';ui();raf=requestAnimationFrame(tick);return}t=a+(a-t);dir=1}

const pickVideoCfg=BL.pickVideoCfg,pickAudioCfg=BL.pickAudioCfg; // 共通部分（common.js）

const RS=$('repsl');RS.innerHTML=Array.from({length:30},(_,i)=>'<button type="button" data-n="'+(i+1)+'">'+(i+1)+'</button>').join('');
const ITEM=42;
function repScrollTo(n,smooth){repIgnore=true;RS.scrollTo({left:(n-1)*ITEM,behavior:smooth?'smooth':'auto'});clearTimeout(repT);repT=setTimeout(()=>{repIgnore=false},smooth?450:80)}
function repPaint(){const isA=$('rep').value==='audio';$('repAudio').classList.toggle('sel',isA);$('repwrap').classList.toggle('off',isA);
  const n=isA?lastNum:+$('rep').value;[...RS.children].forEach(b=>b.classList.toggle('sel',!isA&&+b.dataset.n===n))}
function setRep(v){$('rep').value=String(v);if(v!=='audio')lastNum=+v;repPaint()}
$('repAudio').onclick=()=>setRep('audio');
RS.addEventListener('scroll',()=>{if(repIgnore)return;clearTimeout(repT);repT=setTimeout(()=>{const n=Math.max(1,Math.min(30,Math.round(RS.scrollLeft/ITEM)+1));setRep(n)},120)});
RS.onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;setRep(+b.dataset.n);repScrollTo(+b.dataset.n,true)};
function qLabel(v){if(v==='src'){return '素材と同じ（'+(v2w()||'動画の解像度')+'）'}return $('q').querySelector('option[value="'+v+'"]').text}
function v2w(){return v.videoWidth?v.videoWidth+'×'+v.videoHeight:''}
function qPaint(){$('qlist').innerHTML=[...$('q').options].map(o=>'<button type="button" data-v="'+o.value+'"'+(o.value===$('q').value?' class="sel"':'')+'>'+qLabel(o.value)+'</button>').join('')}
$('qlist').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;$('q').value=b.dataset.v;qPaint()};
function esheetOpen(){if($('rep').value!=='audio')lastNum=+$('rep').value;repPaint();qPaint();requestAnimationFrame(()=>repScrollTo(lastNum,false))}
$('estart').onclick=()=>{$('esheet').hidden=true;startExport()};
function startExport(){
  if($('rep').value==='audio'&&!hasAud()){note.textContent='「音声合わせ」でレンダリングするには、「元の音」をオンにするか「裏の音」を選んでください。';return}
  $('dl').classList.remove('ready');$('dl').textContent='↓ もう一度保存';
  if(looping&&phase==='play'&&cacheQ===$('q').value){exportNow();return}
  if(looping)stopLoop();
  expPending=true;startLoop();
}
// ===== プロジェクト保存：動画データはコピーせず「ファイルへのつながり」と設定だけを保存 =====
let vHandle=null,aHandle=null,pend=null;
const VEXT=['.mp4','.mov','.m4v','.webm','.mkv','.3gp'],AEXT=['.mp3','.m4a','.aac','.wav','.ogg','.flac','.opus'];
// AndroidではshowOpenFilePickerが「ファイル」型の選択画面になり、セキュリティフォルダではギャラリーが出ないため使わない
const canPick=false;
async function pick(kind){
  if(!canPick){$(kind==='v'?'file':'bfile').click();return}
  try{const acc=kind==='v'?{'video/*':VEXT}:{'audio/*':AEXT,'video/*':VEXT};
    const [h]=await showOpenFilePicker({types:[{description:kind==='v'?'動画':'音声・動画',accept:acc}],excludeAcceptAllOption:false});
    const f=await h.getFile();
    if(kind==='v'){vHandle=h;if(pend&&pend.step==='v'){pendVideo(f);return}curPid=null;loadVideo(f)}
    else{aHandle=h;if(pend&&pend.step==='a'){pendAudio(f);return}loadAudio(f);audioInit();if(looping&&phase)bgmPlay(true)}
  }catch(e){/* キャンセル */}
}
if(canPick){document.querySelectorAll('label[for=file],label[for=bfile]').forEach(l=>l.addEventListener('click',e=>{e.preventDefault();pick(l.htmlFor==='file'?'v':'a')}))}
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{const q=indexedDB.open('abloop',2);q.onupgradeneeded=()=>{const d=q.result;if(d.objectStoreNames.contains('projects'))d.deleteObjectStore('projects');d.createObjectStore('projects',{keyPath:'id',autoIncrement:true})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});return dbp}
async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('projects',mode);const out=fn(t.objectStore('projects'));t.oncomplete=()=>res(out.result);t.onerror=()=>rej(t.error)})}
const pAll=()=>tx('readonly',st=>st.getAll());
const pGet=id=>tx('readonly',st=>st.get(id));
const pPut=rec=>tx('readwrite',st=>st.put(rec));
const pDel=id=>tx('readwrite',st=>st.delete(id));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function thumb(){try{if(!v.videoWidth)return'';const c=document.createElement('canvas');c.width=160;c.height=Math.round(160*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(looping?cv:v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}catch(e){return''}}
const info=t=>{$('pinfo').textContent=t};
async function pRender(){
  const L=$('plist');let list=[];
  try{list=(await pAll()).sort((a,b)=>b.date-a.date)}catch(e){L.innerHTML='<p class="pinfo">保存機能が使えません（ブラウザの設定を確認してください）。</p>';return}
  if(!list.length){L.innerHTML='<p class="pinfo">まだ保存されたプロジェクトはありません。</p>';return}
  L.innerHTML=list.map(p=>{const d=new Date(p.date);
    return '<div class="pi'+(p.id===curPid?' cur':'')+'">'+(p.thumb?'<img src="'+p.thumb+'" alt="">':'<div class="ph"></div>')+
    '<div><b>'+esc(p.name)+'</b><small>'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' ・ '+esc(p.vName)+(p.aName?' ・ ♪'+esc(p.aName):'')+'</small></div>'+
    '<button data-open="'+p.id+'">開く</button><button class="del" data-del="'+p.id+'">削除</button></div>'}).join('');
}
function showStep(){
  const p=pend.p,isV=pend.step==='v',nm=isV?p.vName:p.aName;
  info((isV?'動画':'裏の音')+'のファイルを選んでください：「'+nm+'」（同じファイルを選ぶとA・B点などが戻ります）');
  $('plist').innerHTML='<button class="okb" id="pstep" style="height:52px">'+(isV?'動画「':'♪ 裏の音「')+esc(nm)+'」を選ぶ</button><button id="pcancel" style="margin-top:6px">やめる</button>';
  $('pstep').onclick=()=>pick(pend.step);$('pcancel').onclick=()=>{pend=null;info('');pRender()};
}
async function fromHandle(h){
  if(!h||!h.getFile)return null;
  try{let st=await h.queryPermission({mode:'read'});if(st!=='granted')st=await h.requestPermission({mode:'read'});if(st!=='granted')return null;return await h.getFile()}catch(e){return null}
}
function applySettings(p){curPid=p.id;$('pname').value=p.name;['spd','q','rep','bvol'].forEach(k=>{if(p[k]!=null)$(k).value=p[k]});setMode(p.mode||'pp');$('bvol').oninput()}
function pendVideo(f){const p=pend.p;$('resume').hidden=true;const same=f.name===p.vName&&(!p.vSize||f.size===p.vSize);
  loadVideo(f,p.A,p.B);note.textContent=same?'プロジェクト「'+p.name+'」を開きました。':'選んだ動画が保存時と違うかもしれません（A・B点はそのまま使います）。';
  if(p.aName){pend.step='a';$('sheet').hidden=true;$('psheet').hidden=false;showStep()}else{finishOpen(p);pend=null;$('psheet').hidden=true}}
function finishOpen(p){useOrig=p.orig??!p.aName;syncSrc()}
function pendAudio(f){const p=pend.p;loadAudio(f,p.bA,p.bB);finishOpen(p);pend=null;$('psheet').hidden=true}
async function openP(p){
  applySettings(p);pend=null;$('bclr').onclick();
  const vf=await fromHandle(p.vh);
  if(!vf){pend={p,step:'v'};showStep();return}
  vHandle=p.vh;loadVideo(vf,p.A,p.B);note.textContent='プロジェクト「'+p.name+'」を開きました。';
  if(p.aName){const af=await fromHandle(p.ah);
    if(af){aHandle=p.ah;loadAudio(af,p.bA,p.bB)}else{pend={p,step:'a'};showStep();return}}
  finishOpen(p);$('psheet').hidden=true;
}
$('popen').onclick=()=>{$('sheet').hidden=true;$('esheet').hidden=true;$('psheet').hidden=false;pend=null;
  if(!$('pname').value)$('pname').value=vFile?vFile.name.replace(/\.[^.]+$/,''):'';
  $('psave').textContent=curPid?'上書き保存':'保存';info('動画ファイルはコピーせず、どのファイルか・A/B点・速度などの設定だけを保存します。開くときは同じ動画を選ぶと設定が戻ります。');pRender()};
$('pclose').onclick=()=>{pend=null;$('psheet').hidden=true};
$('psave').onclick=async()=>{
  if(!vFile){info('先に動画を選んでください。');return}
  const name=($('pname').value||vFile.name).trim();
  const rec={name,date:Date.now(),vName:vFile.name,vSize:vFile.size,vh:vHandle||null,aName:aFile?aFile.name:null,aSize:aFile?aFile.size:null,ah:aFile?aHandle:null,
    A,B,bA,bB,spd:$('spd').value,q:$('q').value,rep:$('rep').value,bvol:$('bvol').value,mode:$('mode').dataset.m,orig:useOrig,thumb:thumb()};
  if(curPid){const old=await pGet(curPid).catch(()=>null);if(old&&old.name===name)rec.id=curPid}
  try{const id=await pPut(rec);curPid=rec.id||id;$('psave').textContent='上書き保存';
    info('「'+name+'」を保存しました。'+(rec.vh?'':'（開くときは同じ動画をもう一度選ぶと設定が戻ります）'));pRender()}
  catch(e){info('保存できませんでした。')}
};
$('plist').onclick=async e=>{
  const o=e.target.closest('[data-open]'),d=e.target.closest('[data-del]');
  if(o){const p=await pGet(+o.dataset.open);if(p)openP(p)}
  if(d){if(d.dataset.sure){await pDel(+d.dataset.del);if(curPid===+d.dataset.del)curPid=null;pRender()}
    else{d.dataset.sure=1;d.textContent='本当に';setTimeout(()=>{if(d.isConnected){delete d.dataset.sure;d.textContent='削除'}},3000)}}
};
// ===== 作業中の自動保存（ブラウザを閉じても続きから）=====
const LKEY='abloop_last';let lastSaved='';
function saveLast(){
  if(!vFile)return;
  const o={name:$('pname').value||vFile.name.replace(/\.[^.]+$/,''),id:curPid,vName:vFile.name,vSize:vFile.size,aName:aFile?aFile.name:null,
    A,B,bA,bB,spd:$('spd').value,q:$('q').value,rep:$('rep').value,bvol:$('bvol').value,mode:$('mode').dataset.m,orig:useOrig};
  const j=JSON.stringify(o);if(j===lastSaved)return;lastSaved=j;
  try{localStorage.setItem(LKEY,JSON.stringify({...o,sv:3,date:Date.now()}))}catch(e){}
}
setInterval(saveLast,1500);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveLast()});
window.addEventListener('pagehide',saveLast);
{let last=null;try{last=JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){}
 if(last){['spd'].forEach(k=>{if(last[k]!=null&&[...$(k).options].some(o=>o.value==last[k]))$(k).value=last[k]});if(last.bvol!=null){$('bvol').value=last.bvol;$('bvol').oninput()}if(last.mode)setMode(last.mode);if(last.orig===false&&!last.aName){useOrig=false;syncSrc()}}
 if(last&&last.vName){const b=$('resume');b.hidden=false;b.textContent='前回の続きから（'+last.vName+'）';
  b.onclick=()=>{applySettings(last);curPid=last.id||null;pend={p:last,step:'v'};note.textContent='前回の動画「'+last.vName+'」を選んでください。';$('file').click()}}}
document.addEventListener('visibilitychange',()=>{last=performance.now()});
// Androidの標準の選択画面を使わず、アプリ内の選択パネルで選ぶ
const SELS={spd:'速度'};
function selText(id){const e=$(id);const o=e.options[e.selectedIndex];return o?o.text:''}
function refreshSels(){for(const id in SELS){const b=$(id+'_b');if(b){const t='速度 '+selText(id).replace('（標準）','');if(b.textContent!==t)b.textContent=t}}}
for(const id in SELS){
  const e=$(id);e.classList.add('nat');
  const b=document.createElement('button');b.type='button';b.id=id+'_b';b.className='selb';b.textContent='速度 '+selText(id).replace('（標準）','');
  e.after(b);
  b.onclick=ev=>{ev.preventDefault();
    $('pickT').textContent=SELS[id];
    $('pickL').innerHTML=[...e.options].map((o,i)=>'<button type="button" data-i="'+i+'"'+(i===e.selectedIndex?' class="sel"':'')+'>'+o.text+'</button>').join('');
    $('pickL').onclick=x=>{const t=x.target.closest('[data-i]');if(!t)return;e.selectedIndex=+t.dataset.i;e.dispatchEvent(new Event('change'));refreshSels();[...$('pickL').children].forEach((c,i)=>c.classList.toggle('sel',i===e.selectedIndex));if(id!=='spd')$('pick').hidden=true};
    $('pick').hidden=false};
}
$('pickX').onclick=()=>{$('pick').hidden=true};
setInterval(refreshSels,500);
// プレビューをタップで全画面（縦横比は保ったまま画面に合わせる）
// 戻るジェスチャーでアプリが閉じない・前のページに戻らないようにする
// （戻る操作が来たら、開いているメニューや全画面を閉じるだけにして、ページには留まる）
{let armed=false;
 const arm=()=>{if(armed)return;armed=true;try{history.pushState({abl:1},'')}catch(e){}};
 document.addEventListener('pointerdown',arm,{capture:true});
 window.addEventListener('popstate',()=>{
   armed=false;arm();
   if(BL.closeMenu())return;
   const open=['pick','esheet','psheet','sheet'].find(id=>!$(id).hidden);
   if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}
   else if(open){$(open).hidden=true}
   else note.textContent='戻る操作は無効にしています（アプリを閉じるときはホームボタンで）。';
 });
}
// プレビューをタップでChromeの全画面（縦横比は保つ）
async function toggleFS(){
  try{if(document.fullscreenElement){await document.exitFullscreen()}else{await stage.requestFullscreen({navigationUI:'hide'})}}
  catch(e){stage.classList.toggle('fs')}
}
stage.addEventListener('click',e=>{if(!v.src)return;if(e.target===v||e.target===cv||e.target===stage||e.target.id==='fs')toggleFS()});
BL.switcher('ab-loop',stage);
ui();
}
</script>
